name: Build FreshMart APK
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Capacitor Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Build Debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FreshMart-POS-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
